title: '### :material-cube-outline: Thing Controller'
desc: |-
  The **Thing Controller** handles physical objects in the game world that are *not* humanoids
  (Pawns). In RimWorld code, almost everything is a "Thing."

  **Includes:**

  *   **Items:** Weapons, Resources, Apparel.
  *   **Buildings:** Walls, Furniture, Workbenches.
  *   **Plants:** Crops, Trees.
/api/v1/item/recipes:
  desc: Retrieves crafting recipes associated with a specific item. This includes details on ingredients, work amount, required skills, and production stations.
  curl: |-
    **Example:**
    ```bash
    curl --request GET \
    --url "http://localhost:8765/api/v1/item/recipes?def_name=MealSimple"
    ```
  request: ''
  response: |-
    **Response:**
    ```json
    {
        "success": true,
        "data": {
            "item_def_name": "MealSimple",
            "item_label": "simple meal",
            "recipes": [
                {
                    "recipe_def_name": "CookMealSimple",
                    "label": "cook simple meal",
                    "job_string": "Cooking simple meal.",
                    "work_amount": 300.0,
                    "work_time_seconds": 5.0,
                    "ingredients": [
                        {
                            "summary": "Raw food",
                            "count": 0.5,
                            "is_fixed_item": false,
                            "allowed_def_names": ["RawPotatoes", "RawRice", "Meat_Chicken"]
                        }
                    ],
                    "produced_at": [
                        {"def_name": "ElectricStove", "label": "electric stove"},
                        {"def_name": "FueledStove", "label": "fueled stove"},
                        {"def_name": "Campfire", "label": "campfire"}
                    ],
                    "skill_requirements": [{"skill": "Cooking", "min_level": 0}],
                    "research_prerequisite": null
                }
            ]
        },
        "timestamp": "2025-12-11T19:46:05.7088803Z"
    }
    ```
  method: GET
/api/v1/item/sources:
  desc: Identifies the various methods by which a specific item can be obtained in the game. This includes flags for broad categories (Mining, Trading, Crafting) and specific details like the names of the ores or plants that produce the item.
  curl: |-
    **Example:**
    ```bash
    curl --request GET \
    --url "http://localhost:8765/api/v1/item/sources?def_name=Steel"
    ```
  request: ''
  response: |-
    **Response:**
    ```json
    {
        "success": true,
        "data": {
            "def_name": "Steel",
            "label": "steel",
            "thing_categories": [
                "ResourcesRaw",
                "Resources"
            ],
            "can_craft": true,
            "can_trade": true,
            "can_harvest": false,
            "can_mine": true,
            "can_butcher": false,
            "crafting_recipes": [
                "SmeltWeapon",
                "SmeltApparel",
                "ExtractMetalFromSlag"
            ],
            "harvested_from": [],
            "mined_from": [
                "MineableSteel"
            ],
            "trade_tags": [
                "BulkGoods",
                "ExoticMisc"
            ]
        },
        "timestamp": "2025-12-11T19:46:05.7088803Z"
    }
    ```
  method: GET

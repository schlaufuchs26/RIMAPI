/api/v1/resources/stored:
  desc: |-
    Retrieves a detailed list of all items currently stored on a specified
    map. Optionally, results can be filtered by resource category. This
    endpoint provides granular information about each stored item,
    including its ID, definition name, label, and stack count.
  curl: |-
    **Example:**
    ```bash
    # Get all stored resources
    curl --request GET \
    --url 'http://localhost:8765/api/v1/resources/stored?map_id=0'

    # Get stored resources by category
    curl --request GET \
    --url 'http://localhost:8765/api/v1/resources/stored?map_id=0&category=Foods'

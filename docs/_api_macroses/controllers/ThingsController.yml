/api/v1/resources/storages/summary:
  desc: |-
    Provides a summary of all storage areas (stockpiles and dumping grounds)
    on a specified map, including the total number of stockpiles, total cells,
    used cells, and utilization percentage.
  curl: |-
    **Example:**
    ```bash
    curl --request GET \
    --url 'http://localhost:8765/api/v1/resources/storages/summary?map_id=0'
    ```
  request: ''
  response: |-
    **Response:**
    ```json
    {
        "success": true,
        "data": {
            "total_stockpiles": 5,
            "total_cells": 200,
            "used_cells": 120,
            "utilization_percent": 60
        },
        "errors": [],
        "warnings": [],
        "timestamp": "2025-12-12T10:00:00.0000000Z"
    }
    ```
  method: GET
/api/v1/item/spawn:
  desc: Spawn an item on the map at selected position.
  method: POST
  curl: |-
    **Example:**
    ```bash
    curl --request POST \
    --url http://localhost:8765/api/v1/item/spawn \
    --header 'content-type: application/json' \
    --data '{
        "def_name": "BilliardsTable",
        "stuff_def_name": "WoodLog",
        "quality": "Legendary",
        "amount": 1,
        "x": 120,
        "z": 106
    }'
    ```
  request: |-
    **Request:**
    ```json
    {
        "def_name": "BilliardsTable",
        "stuff_def_name": "WoodLog",
        "quality": "Legendary",
        "amount": 1,
        "x": 120,
        "z": 106
    }
    ```
  response: |-
    **Response:**
    ```json
    {
        "success": true,
        "errors": [],
        "warnings": [],
        "timestamp": "2025-12-10T19:53:16.733319Z"
    }
    ```
/api/v1/things/set-forbidden:
  desc: Toggle the forbidden status on one or more things by ID. Useful for unforbidding starting items in a new colony or managing item access for colonists.
  curl: |-
    **Example:**
    ```bash
    curl --request POST \
    --url http://localhost:8765/api/v1/things/set-forbidden \
    --header 'content-type: application/json' \
    --data '{
        "thing_ids": [12345, 12346, 12347],
        "map_id": 0,
        "forbidden": false
    }'
    ```
  request: |-
    **Request:**
    ```json
    {
        "thing_ids": [12345, 12346, 12347],
        "map_id": 0,
        "forbidden": false
    }
    ```
  response: |-
    **Response (all updated):**
    ```json
    {
        "success": true,
        "errors": [],
        "warnings": [],
        "timestamp": "2026-03-31T03:45:51.148Z"
